[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saturnix-harness"
version = "0.1.0"
description = "SATURNIX-HARNESS: a modular multi-agent AI construction, routing, execution, verification, and memory framework."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SATURNIX-HARNESS" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
saturnix = "saturnix_harness.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["saturnix_harness*"]

[tool.setuptools.package-data]
"saturnix_harness.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
