services:
  saturnix-api:
    build: .
    env_file:
      - .env
    ports:
      - "8088:8088"
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  saturnix-dashboard:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_SATURNIX_API_BASE: http://localhost:8088
    ports:
      - "3000:3000"
    depends_on:
      - saturnix-api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
