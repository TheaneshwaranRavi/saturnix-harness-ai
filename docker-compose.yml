services:
  saturnix-api:
    build: .
    env_file:
      - .env
    ports:
      - "8088:8088"
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:

